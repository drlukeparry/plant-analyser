[project]
name = "plant-analyser"
version = "0.1.0"
description = "Cellular structure analysis and generative framework for dyed plant micrographs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cellpose>=3.0",
    "scikit-image>=0.24",
    "shapely>=2.0",
    "opencv-python>=4.10",
    "torch>=2.3",
    "torchvision>=0.18",
    "torch-geometric>=2.5",
    "networkx>=3.3",
    "diffusers>=0.29",
    "albumentations>=1.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pytorch3dunet>=1.9.6",
    "scikit-learn>=1.9.0",
]
